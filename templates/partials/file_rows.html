{% import "partials/file_tags.html" as file_tags %}
      {% for row in files.rows %}
      <tr class="table__row" data-file-drop data-file-id="{{ row.id }}" data-file-kind="{{ row.kind }}"{% if files.draggable %} draggable="true"{% endif %}>
        <td class="table__name">
          <span class="table__name-link">{{ row.name }}</span>
          <form class="table__rename" method="post" action="/partials/files/{{ row.id }}/rename" hx-post="/partials/files/{{ row.id }}/rename" hx-target="#toast" hx-swap="innerHTML" data-file-rename hidden>
            <input class="input" type="text" name="name" value="{{ row.name }}" maxlength="255" autocomplete="off" spellcheck="false" aria-label="{{ files.labels.rename }}" required>
            <button class="sr-only" type="submit">{{ files.labels.rename }}</button>
          </form>
        </td>
        <td class="table__tags"><span class="table__tags-list" id="file-tags-{{ row.id }}">{% call file_tags::pills(row) %}{% endcall %}</span></td>
        <td><span class="table__text">{{ row.size }}</span></td>
        <td><span class="table__text">{{ row.mtime }}</span></td>
      </tr>
      {% endfor %}
