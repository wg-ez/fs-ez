name: docker

# Triggers : tag `v*` = publication, dispatch manuel = publication.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'image (défaut : sha court du commit)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  release:
    name: build multi-arch et publication
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculer les tags et vérifier la version
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "version introuvable dans Cargo.toml" >&2
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              tag="${INPUT_TAG:-sha-$(git rev-parse --short=12 HEAD)}"
              if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
                echo "tag d'image invalide: $tag" >&2
                exit 1
              fi
              if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                default_branch=true
              else
                default_branch=false
              fi
              ;;
            *)
              tag="$GITHUB_REF_NAME"
              if [ "v$version" != "$tag" ]; then
                echo "tag $tag != v$version (Cargo.toml)" >&2
                exit 1
              fi
              git fetch --no-tags origin "$DEFAULT_BRANCH"
              if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
                default_branch=true
              else
                default_branch=false
              fi
              ;;
          esac

          tags="$IMAGE:$tag"
          if [ "$default_branch" = true ]; then
            tags="$tags,$IMAGE:latest"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          printf 'image: %s\n' "$tags"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
