[build]
# Pas de cache incrémental : il pesait plus de 20 Go et n'est pas réutilisé entre deux suites complètes.
incremental = false

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
